name: Commitlint

on:
  pull_request:
  push:
    branches-ignore:
      - main

jobs:
  commitlint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run commitlint
        run: npx commitlint --from ${{ github.event.pull_request.base.sha || github.event.before }} --to HEAD --verbose
